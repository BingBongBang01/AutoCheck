stages:
  - id: stage_vlan
    label: "VLAN"
    depends_on: []
    commands: ["show vlan brief"]

  - id: stage_stp
    label: "STP"
    depends_on: [stage_vlan]
    commands: ["show spanning-tree vlan 1,100,200,999"]

  - id: stage_lacp
    label: "LACP"
    depends_on: [stage_stp]
    commands: ["show port-channel summary"]

  - id: stage_mlag
    label: "MLAG"
    depends_on: [stage_lacp]
    commands: ["show mlag"]

  - id: stage_ospf
    label: "OSPF"
    depends_on: [stage_mlag]
    commands: ["show ip ospf neighbor"]

  - id: stage_vrrp
    label: "VRRP"
    depends_on: [stage_ospf]
    commands: ["show vrrp brief"]

  - id: stage_acl
    label: "ACL"
    depends_on: [stage_vrrp]
    commands: ["show ip access-lists"]
