stage_vlan:
  checks:
    - id: vlan_100_exists
      type: in_set
      applies_to: [Access1, Access2, Agg1, Agg2, Core1, Core2]
      expected_vlan_id: 100

    - id: vlan_200_exists
      type: in_set
      applies_to: [Access3, Agg1, Agg2, Core1, Core2]
      expected_vlan_id: 200

    - id: vlan_999_exists
      type: in_set
      applies_to: [Core1, Core2, Agg1, Agg2, Access1, Access2, Access3]
      expected_vlan_id: 999

stage_stp:
  checks:
    - id: root_priority_vlan1_core1
      type: exact_match
      device: Core1
      field: "priority_vlan1"
      expected: 4096

    - id: root_priority_vlan1_core2
      type: exact_match
      device: Core2
      field: "priority_vlan1"
      expected: 8192

    - id: root_priority_vlan100_agg1
      type: exact_match
      device: Agg1
      field: "priority_vlan100"
      expected: 4096

    - id: root_priority_vlan200_agg1
      type: exact_match
      device: Agg1
      field: "priority_vlan200"
      expected: 4096

    - id: root_priority_vlan999_agg1
      type: exact_match
      device: Agg1
      field: "priority_vlan999"
      expected: 4096

    - id: root_priority_vlan100_agg2
      type: exact_match
      device: Agg2
      field: "priority_vlan100"
      expected: 8192

    - id: root_priority_vlan200_agg2
      type: exact_match
      device: Agg2
      field: "priority_vlan200"
      expected: 8192

    - id: root_priority_vlan999_agg2
      type: exact_match
      device: Agg2
      field: "priority_vlan999"
      expected: 8192

    - id: no_stp_priority_on_access1
      type: absence
      device: Access1
      field: "configured_priority"

    - id: no_stp_priority_on_access2
      type: absence
      device: Access2
      field: "configured_priority"

    - id: no_stp_priority_on_access3
      type: absence
      device: Access3
      field: "configured_priority"

    - id: actual_root_bridge_vlan1
      type: exact_match
      field: "root_bridge_vlan1"
      expected: "Core1"

    - id: actual_root_bridge_vlan100
      type: exact_match
      field: "root_bridge_vlan100"
      expected: "Agg1"

    - id: actual_root_bridge_vlan200
      type: exact_match
      field: "root_bridge_vlan200"
      expected: "Agg1"

stage_lacp:
  checks:
    - id: lacp_no_degraded_agg1
      type: lacp_no_degraded
      applies_to: [Agg1]

    - id: lacp_no_degraded_agg2
      type: lacp_no_degraded
      applies_to: [Agg2]

    - id: lacp_no_degraded_access1
      type: lacp_no_degraded
      applies_to: [Access1]

    - id: lacp_no_degraded_access2
      type: lacp_no_degraded
      applies_to: [Access2]

    - id: lacp_no_degraded_access3
      type: lacp_no_degraded
      applies_to: [Access3]

stage_mlag:
  checks:
    - id: mlag_active_agg1
      type: mlag_active
      applies_to: [Agg1]

    - id: mlag_active_agg2
      type: mlag_active
      applies_to: [Agg2]

stage_ospf:
  checks:
    - id: ospf_all_full_core1
      type: ospf_all_full
      applies_to: [Core1]

    - id: ospf_all_full_core2
      type: ospf_all_full
      applies_to: [Core2]

stage_vrrp:
  checks:
    - id: vrrp_single_master_vlan100
      type: vrrp_single_master
      interface: "Vlan100"
      group: [Agg1, Agg2]

    - id: vrrp_single_master_vlan200
      type: vrrp_single_master
      interface: "Vlan200"
      group: [Agg1, Agg2]

stage_acl:
  checks:
    - id: acl_mgmt_exists_core1
      type: acl_exists
      acl_name: "MGMT-ACL"
      applies_to: [Core1]

    - id: acl_mgmt_exists_core2
      type: acl_exists
      acl_name: "MGMT-ACL"
      applies_to: [Core2]

    - id: acl_mgmt_explicit_deny_core1
      type: acl_has_explicit_deny_any
      acl_name: "MGMT-ACL"
      applies_to: [Core1]

    - id: acl_mgmt_explicit_deny_core2
      type: acl_has_explicit_deny_any
      acl_name: "MGMT-ACL"
      applies_to: [Core2]
