<!doctype html>
<!-- 개발용 레이아웃 프리뷰 — pywebview 없이 '자동 실시간 감시' 패널만 목 데이터로 그린다.
     제품 화면에는 포함되지 않는다(index.html에서 참조하지 않음). -->
<html lang="ko"><head><meta charset="utf-8"><title>RTM preview</title>
<link rel="stylesheet" href="style.css"></head>
<body><div id="content" style="padding:24px"></div>
<script>
let selectedDeviceNames = new Set(['Core1','Core2','Core3']);
function showToast(m){console.log('toast',m);}
const DEVS=['Core1','Core2','Core3','Core4'];
function mockState(){
  return {ok:true,running:true,started_at:0,
    devices:DEVS.map((d,i)=>({device:d,has_baseline:i<3,line_count:120+i,
      lines:Array.from({length:14},(_,k)=>({ts:'10:2'+(k%10)+':01',text:d+'(config)# '+(k%3?'show vlan brief':'no vlan 100')+' '+k})),
      checklist:[{key:'vlan',label:'VLAN 설정 유지',status:i===0?'fail':'pending',detail:i===0?'Baseline 등록 VLAN 100 삭제 명령 감지!':'변경 없음',count:i===0?2:0,last_ts:'10:24:01',severity:'CRITICAL'},
                 {key:'interface',label:'인터페이스 설정/활성',status:i===1?'warn':'pending',detail:i===1?'인터페이스 Ethernet3 활성화(no shutdown) 명령 감지':'변경 없음',count:i===1?1:0,last_ts:'10:24:07'},
                 {key:'route',label:'정적 라우팅 유지',status:'pending',detail:'변경 없음',count:0,last_ts:''},
                 {key:'neighbor',label:'라우팅 인접(BGP/OSPF)',status:i===0?'fail':'pending',detail:'라우팅 네이버 10.1.1.2 인접관계 DOWN 감지!',count:1,last_ts:'10:24:03'},
                 {key:'link',label:'링크 상태',status:i===3?'unknown':'recovered',detail:i===3?'Baseline 기준 없음':'인터페이스 Ethernet1 UP 복구',count:1,last_ts:'10:24:09'},
                 {key:'stp_mlag',label:'STP / MLAG 안정',status:'pending',detail:'변경 없음',count:0,last_ts:''},
                 {key:'ops',label:'위험 운영 명령 없음',status:'pending',detail:'변경 없음',count:0,last_ts:''}],
      fail_count:i===0?2:0,warn_count:i===1?1:0,status:i===0?'fail':(i===1?'warn':(i===3?'ok':'ok')),last_activity:0})),
    alerts:[],
    analysis:{verdict:'fail',headline:'CRITICAL 3건 — 즉시 확인 필요',
      summary:'경고 5건이 장비 2대에서 발생했습니다. 가장 많은 장비는 Core1(4건)입니다.',
      counts:{CRITICAL:3,MAJOR:1,WARNING:1},
      findings:[{device:'Core1',severity:'CRITICAL',title:'작업 명령이 통신 단절을 유발한 것으로 보입니다',
        cause:"'no vlan 100' 실행 직후 DOWN 로그 2건이 이어졌습니다.",
        action:'해당 명령을 되돌리거나(no 형태 복구) Baseline 설정과 대조해 즉시 확인하세요.',count:4,
        evidence:['%LINEPROTO-5-UPDOWN: Line protocol on Interface Ethernet1, changed state to down','%BGP-5-ADJCHANGE: peer 10.1.1.2 Down']},
        {device:'Core2',severity:'MAJOR',title:'Baseline 대비 설정 변경 감지',cause:'설정 삭제 0건, shutdown 1건이 입력됐습니다.',action:'의도된 작업인지 확인하고, 계획에 없던 변경이면 원복하세요.',count:1,evidence:['Core2(config-if-Et3)#no shutdown']}]}};
}
async function call(fn,...a){
  if(fn==='get_realtime_monitor_state') return mockState();
  if(fn==='get_realtime_baseline_status') return {running:true,autostart:true,devices:DEVS};
  return {ok:true};
}
function openRealtimeAlertDetail(d){console.log('detail',d);}
function rtEscape(t){const d=document.createElement('div');d.textContent=t==null?'':String(t);return d.innerHTML;}
</script>
<script src="js/realtime-monitor-panel.js?v=3"></script>
<script>
document.getElementById('content').innerHTML =
  '<div class="term-page" style="height:calc(100vh - 48px)"><div class="card" style="min-height:120px">세션 터미널 자리</div>' + realtimeMonitorMarkup() + '</div>';
initRealtimeMonitorPanel();
</script>
</body></html>
