<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>LAB 자동채점 프로그램</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <div id="topbar">
    <div class="tb-item" id="tb-context-selector" title="고객사와 정기점검 변경"><span class="material-symbols-rounded">business</span><span id="tb-customer-name">고객사 없음</span><span style="color:var(--sub);">/</span><span id="tb-profile-name">정기점검 없음</span><span class="material-symbols-rounded" style="font-size:16px">expand_more</span></div>
    <div class="tb-spacer"></div>
    <div class="tb-icon-btn" id="tb-theme-toggle" title="테마 전환"><span class="material-symbols-rounded" id="tb-theme-icon">dark_mode</span></div>
  </div>

  <div id="sidebar">
    <div class="nav-item" data-page="dashboard"><span class="material-symbols-rounded">dashboard</span><span class="nav-label">대시보드</span></div>
    <div class="nav-item" data-page="inventory"><span class="material-symbols-rounded">dns</span><span class="nav-label">장비 인벤토리</span></div>
    <div class="nav-item" data-page="connection"><span class="material-symbols-rounded">router</span><span class="nav-label">연결(터미널)</span></div>
    <div class="nav-item" data-page="catalog"><span class="material-symbols-rounded">checklist</span><span class="nav-label">커맨드 카탈로그</span></div>
    <div class="nav-item" data-page="inspection"><span class="material-symbols-rounded">fact_check</span><span class="nav-label">점검 항목 설정</span></div>
    <div style="height:1px;background:var(--border);margin:8px 4px;"></div>
    <div class="nav-item" data-page="discovery"><span class="material-symbols-rounded">radar</span><span class="nav-label">EVE 구성 불러오기</span></div>
    <div class="nav-item" data-page="collection"><span class="material-symbols-rounded">terminal</span><span class="nav-label">수집</span></div>
    <div class="nav-item" data-page="analysis"><span class="material-symbols-rounded">insights</span><span class="nav-label">분석</span></div>
    <div class="nav-item" data-page="findings"><span class="material-symbols-rounded">bug_report</span><span class="nav-label">발견사항</span><span class="nav-badge" id="nav-findings-badge" style="display:none"></span></div>
    <div class="nav-item" data-page="reports"><span class="material-symbols-rounded">description</span><span class="nav-label">보고서</span></div>
    <div class="nav-item" data-page="history"><span class="material-symbols-rounded">history</span><span class="nav-label">이력</span></div>
    <div class="nav-item" data-page="knowledge"><span class="material-symbols-rounded">menu_book</span><span class="nav-label">지식베이스</span></div>
    <div style="height:1px;background:var(--border);margin:10px 4px;"></div>
    <div class="nav-item" data-page="architecture"><span class="material-symbols-rounded">account_tree</span><span class="nav-label">아키텍처</span></div>
    <div class="nav-item" data-page="settings"><span class="material-symbols-rounded">settings</span><span class="nav-label">설정</span></div>
    <div class="nav-item" id="nav-collapse" style="margin-top:8px;"><span class="material-symbols-rounded">chevron_left</span><span class="nav-label">접기</span></div>
  </div>

  <div id="content"></div>

  <div id="statusbar">
    <span id="sb-project">프로젝트: -</span>
    <span id="sb-connection">연결: -</span>
    <span id="sb-version">v-</span>
    <span style="flex:1"></span>
    <span id="sb-clock"></span>
  </div>

</div>

<script src="js/dashboard.js"></script>
<script src="js/discovery.js"></script>
<script src="js/collection.js"></script>
<script src="js/findings.js"></script>
<script src="js/reports.js"></script>
<script src="js/history.js"></script>
<script src="js/inventory.js"></script>
<script src="js/connection.js"></script>
<script src="js/catalog.js"></script>
<script src="js/architecture.js"></script>
<script src="js/analysis.js"></script>
<script src="js/inspection.js"></script>
<script src="js/knowledge.js"></script>
<script src="js/settings.js"></script>
<script src="js/core.js"></script>
</body>
</html>
